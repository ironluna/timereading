<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>直播间简约时钟 · OBS透明工具</title>
  <style>
    /* 全局重置 + 透明背景核心 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: transparent;   /* 完全透明，OBS叠加用 */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Inter', 'SF Pro Display', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      font-weight: 400;
      /* 防止任何意外背景色 */
      background: transparent;
      padding: 0 4px;
      overflow: hidden;               /* 防止滚动条破坏透明感 */
    }

    /* 时钟容器 —— 保持简约干净 */
    .clock-container {
      background: transparent;       /* 完全透明，只留文字 */
      text-align: center;
      line-height: 1.4;
      user-select: none;
      white-space: nowrap;           /* 所有内容不换行，保持单行布局 */
      letter-spacing: 0.02em;
      /* 轻微阴影提升可读性，但不会破坏透明底 (OBS中可根据背景调节) */
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.35), 0 0 2px rgba(0, 0, 0, 0.2);
      /* 文字颜色用纯白，在OBS深色或浅色背景上都能清晰显示 */
      color: #ffffff;
      padding: 12px 24px;            /* 给一点内边距，避免边缘贴字 */
      border-radius: 24px;           /* 视觉柔和，完全透明不显示底色 */
    }

    /* 主时间行：年月日 时分秒 以及周几都放在一行内 (简约直观) */
    .datetime-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: nowrap;             /* 禁止换行 */
      gap: 0.4em;                    /* 元素间距均等 */
      font-size: clamp(1.8rem, 10vw, 3.8rem); /* 根据屏幕自适应，OBS通常设置为大尺寸 */
      font-weight: 500;
      white-space: nowrap;
    }

    /* 日期部分 (年月日) */
    .date-part {
      font-weight: 400;
      /* 可选：稍微调低亮度或保持一样 */
    }

    /* 时间部分 (时分秒) */
    .time-part {
      font-weight: 600;              /* 时间稍微突出 */
      font-variant-numeric: tabular-nums; /* 数字等宽，防止跳动 */
    }

    /* 周几部分 */
    .weekday-part {
      font-weight: 400;
      /* 用稍小的字重，但大小与整体一致 */
    }

    /* 使用伪元素或间隔符优化视觉——不添加额外符号，靠间距和自然分隔 */
    /* 但同时为了视觉更清晰，可以加入微小的间距 */

    /* 添加冒号闪烁效果? 不需要，保持持续显示就好，更简约 */

    /* 针对非常窄的屏幕，允许缩放字体大小 */
    @media (max-width: 480px) {
      .datetime-row {
        font-size: clamp(1.2rem, 8vw, 2.2rem);
        gap: 0.2em;
      }
    }

    /* 确保文字在透明背景下有最高可读性，并可选支持轻微背景模糊？但保持纯透明 */
    /* 设置一个极微弱的文字轮廓或发光效果, 但不影响透明背景 */
    .clock-container {
      /* 确保任何情况下都没有背景色 */
      background-color: transparent !important;
      backdrop-filter: none;         /* 如果某些浏览器强制模糊，禁用它 */
    }

    /* 为了更美观，可以加一点渐变的文字？不用，保持纯白最干净，OBS方便调节 */

    /* 但我们想保持年月日、时分秒、周几之间自然区隔，可以用一点点不同透明度或粗细 */
    .date-part {
      opacity: 0.95;
    }

    .weekday-part {
      opacity: 0.95;
    }

    /* 也可以让时间部分稍微更亮，但都一样白，用font-weight区分就足够了 */

  </style>
</head>
<body>
  <div class="clock-container">
    <!-- 所有日期时间信息都放在一行，方便OBS裁切和布局 -->
    <div class="datetime-row" id="datetimeDisplay">
      <!-- 通过JS动态填充，避免初始空白 -->
      <span class="date-part" id="datePart">2025-01-01</span>
      <span class="time-part" id="timePart">00:00:00</span>
      <span class="weekday-part" id="weekdayPart">周三</span>
    </div>
  </div>

  <script>
    (function() {
      // 获取DOM元素
      const datePartEl = document.getElementById('datePart');
      const timePartEl = document.getElementById('timePart');
      const weekdayPartEl = document.getElementById('weekdayPart');

      // 星期映射数组 (0=周日, 1=周一, ... 6=周六)
      const WEEKDAYS = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

      // 补零函数
      const padZero = (num, length = 2) => {
        return String(num).padStart(length, '0');
      };

      // 核心更新函数
      function updateClock() {
        const now = new Date();

        // 年月日 (格式: YYYY-MM-DD, 简约风格)
        const year = now.getFullYear();
        const month = padZero(now.getMonth() + 1); // 月份从0开始
        const day = padZero(now.getDate());
        const dateStr = `${year}-${month}-${day}`;

        // 时分秒 (HH:mm:ss)
        const hours = padZero(now.getHours());
        const minutes = padZero(now.getMinutes());
        const seconds = padZero(now.getSeconds());
        const timeStr = `${hours}:${minutes}:${seconds}`;

        // 星期几
        const weekdayIndex = now.getDay(); // 0~6
        const weekdayStr = WEEKDAYS[weekdayIndex];

        // 更新到页面
        datePartEl.textContent = dateStr;
        timePartEl.textContent = timeStr;
        weekdayPartEl.textContent = weekdayStr;
      }

      // 立即执行一次，避免初始空白
      updateClock();

      // 使用 requestAnimationFrame 或者 setInterval 每秒钟更新
      // 为了精准且性能良好，使用 setInterval 每秒更新 (时钟不需要毫秒精度)
      // 但为了在秒数变化时立即更新(尤其是跨秒瞬间)，使用setInterval(1000)可满足
      let intervalId = setInterval(updateClock, 1000);

      // 页面可见性变化时，如果页面变为可见，立即刷新一次（避免后台节流造成的延迟）
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          updateClock();
        }
      });

      // 可选：清理定时器（虽然页面关闭会自动清理，但保持良好习惯）
      window.addEventListener('beforeunload', () => {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      });

      // 额外优化：如果时间刚好在整秒边界，setInterval可能略有偏差，但完全满足直播需求。
      // 为了更顺滑，可以改用 requestAnimationFrame + 时间比对，但没必要。
    })();
  </script>
</body>
</html>
